tools:
  - name: query_restaurants
    description: Search restaurant candidates by location and optional maximum delivery wait time.
    params:
      type: object
      required:
        - location
      properties:
        location:
          type: string
          description: Area to search, for example Ocean Park 1.
        max_wait_time:
          type: integer
          description: Maximum acceptable delivery ETA in minutes.
    returns:
      type: array
      description: Restaurant candidates with id, name, location, rating, predicted_eta, and confidence.

  - name: get_eta_estimate
    description: Get predicted delivery ETA and confidence for a restaurant.
    params:
      type: object
      required:
        - restaurant_id
      properties:
        restaurant_id:
          type: integer
          description: Restaurant id returned by query_restaurants.
    returns:
      type: object
      description: predicted_eta in minutes and confidence from 0.0 to 1.0.

  - name: get_evidence
    description: Fetch source links and review evidence for a restaurant.
    params:
      type: object
      required:
        - restaurant_id
      properties:
        restaurant_id:
          type: integer
          description: Restaurant id to inspect.
    returns:
      type: object
      description: source_links and review summaries.

  - name: record_feedback
    description: Store user feedback for a recommendation.
    params:
      type: object
      required:
        - query
        - suggestion_id
        - user_rating
      properties:
        query:
          type: string
          description: Original user query.
        suggestion_id:
          type: integer
          description: Restaurant id or suggestion id being rated.
        user_rating:
          type: integer
          minimum: 1
          maximum: 5
          description: User rating from 1 to 5.
        feedback_text:
          type: string
          description: Optional free-text feedback.
    returns:
      type: object
      description: Feedback recording status and id.

  - name: clarify
    description: Ask the user a focused clarification question.
    params:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: Question to ask before continuing.
    returns:
      type: object
      description: Clarification request for the next user turn.
